name: Validate CodebaseScan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run the repository action
        uses: ./
        with:
          path: fixtures/hardened-saas
          version: 0.3.0
          policy: advisory
          report-directory: codebasescan-action-report
          upload-artifact: 'false'
          upload-sarif: 'false'

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CODEBASESCAN_SEMGREP: 'false'
      CODEBASESCAN_GITLEAKS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run benchmark
      - run: npm run test:integration
      - name: Generate local audit artifacts and exercise baseline gate
        run: |
          npm run cli -- audit fixtures/hardened-saas --format json --output codebasescan-ci-base.json
          npm run cli -- audit fixtures/hardened-saas --baseline codebasescan-ci-base.json --fail-on high --format sarif --output codebasescan-ci.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codebasescan-audit
          path: |
            codebasescan-ci-base.json
            codebasescan-ci.sarif
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=low

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.16.0'
            manager: npm
          - node: '24'
            manager: npm
          - node: '22.16.0'
            manager: pnpm
          - node: '22.16.0'
            manager: yarn
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CODEBASESCAN_SEMGREP: 'false'
      CODEBASESCAN_GITLEAKS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install project dependencies
        run: npm ci
      - name: Enable pnpm
        if: matrix.manager == 'pnpm'
        run: corepack enable && corepack prepare pnpm@10.32.0 --activate
      - name: Enable Yarn Classic
        if: matrix.manager == 'yarn'
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Build packed CLI
        run: npm run build:cli
      - name: Test clean ${{ matrix.manager }} install
        run: node scripts/test-install.mjs ${{ matrix.manager }}
