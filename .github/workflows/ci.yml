name: Validate CodebaseScan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      CODEBASESCAN_AI: disabled
      CODEBASESCAN_SEMGREP: 'false'
      CODEBASESCAN_GITLEAKS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run benchmark
      - run: npm run test:graph
      - name: Generate local audit artifacts and exercise baseline gate
        run: |
          npm run cli -- audit fixtures/hardened-saas --format json --output codebasescan-ci-base.json
          npm run cli -- audit fixtures/hardened-saas --baseline codebasescan-ci-base.json --fail-on high --format sarif --output codebasescan-ci.sarif
      - uses: actions/upload-artifact@v7
        with:
          name: codebasescan-audit
          path: |
            codebasescan-ci-base.json
            codebasescan-ci.sarif
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=low
