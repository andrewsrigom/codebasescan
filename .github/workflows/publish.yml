name: Publish CodebaseScan

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      CODEBASESCAN_AI: disabled
      CODEBASESCAN_SEMGREP: 'false'
      CODEBASESCAN_GITLEAKS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Run the complete release gate
        run: npm run release:check

  publish:
    if: github.event_name == 'push' && github.repository == 'andrewsrigom/codebasescan'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      CODEBASESCAN_AI: disabled
      CODEBASESCAN_SEMGREP: 'false'
      CODEBASESCAN_GITLEAKS: 'false'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Match package, release guard, and tag
        run: node scripts/check-release.mjs publish
      - name: Run release gate
        run: npm run release:check
      - name: Publish with trusted npm OIDC
        run: node scripts/publish-release.mjs
      - name: Create matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "CodebaseScan $RELEASE_TAG" --generate-notes --verify-tag
          fi
